name: Java CI/CD Pipeline

# Cấu hình kích hoạt (Trigger)
on:
  push:
    branches: [ "release" ] # CD chạy khi có code đẩy vào release
  pull_request:
    branches: [ "develop", "release" ] # CI chạy khi tạo PR vào develop hoặc release

jobs:
  # 1. JOB BUILD & TEST (CI)
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Lấy mã nguồn từ GitHub
      uses: actions/checkout@v3

    - name: Cài đặt môi trường JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # Tự động cache thư viện Maven để chạy nhanh hơn ở các lần sau

    - name: Build project với Maven
      run: mvn -f ShoeStore/pom.xml clean package -DskipTests 
      # Nếu dự án có viết Unit Test, bạn hãy bỏ "-DskipTests" đi để nó tự động chạy Test

    - name: Lưu trữ file .war (Artifact)
      uses: actions/upload-artifact@v3
      with:
        name: my-webapp
        path: ShoeStore/target/*.war

  # 2. JOB DEPLOY TO SERVER (CD) - Chỉ chạy khi push vào nhánh release
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    
    steps:
    - name: Tải file .war đã build từ job trên
      uses: actions/download-artifact@v3
      with:
        name: my-webapp
        path: target/

    - name: Đẩy file .war lên Server qua SSH
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "target/*.war"
        target: "/opt/tomcat/webapps/" # Đổi đường dẫn này theo server Tomcat thực tế
        strip_components: 1
